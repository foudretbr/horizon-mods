id = "drop_physics"
kind = "native-mod"
name = "Drop Physics"
summary = "Dropped items tumble while they fly and settle on their flattest side."
description = """
Dropped items get some physics. A thrown or dropped item tumbles while it flies, and on the ground it settles on its flattest side: flat items lie on their face, blocks rest on a side. No more bobbing or spinning on the ground.

It only changes how items are drawn on your screen: nothing changes in the world or for other players.

The approach follows [Horizon Physics](https://github.com/tariksabanuz/PhysicsModHorizon) by tariksabanuz (MIT), itself inspired by PhysicsMod by Haubna; this is a smaller rewrite for the current Horizon API. It adapts Horizon's own dropped-item drawing code, so it is under Horizon's licence (LGPL-3.0-or-later) and carries its notices.

A native mod: it needs a Horizon Nightly, not the v0.2.97 release. Each version is made for one Nightly, and the launcher builds it for the Horizon your instance plays."""
authors = ["foudretbr"]
owners = ["foudretbr"]
owner_ids = [86318354]
license = "LGPL-3.0-or-later"
source = "https://github.com/foudretbr/drop-physics"
icon = "icons/drop_physics.png"
categories = ["utility"]
tags = ["physics", "items", "drops"]

